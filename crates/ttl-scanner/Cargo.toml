[package]
name = "sentinel-ttl-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ledgers-remaining computation and health-band classification for Soroban ledger entries."

[dependencies]
sentinel-rpc-client = { path = "../rpc-client" }
sentinel-xdr-builder = { path = "../xdr-builder" }
stellar-xdr.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The round-2 regression test spins a tiny in-process RPC server to observe how
# many `getLedgerEntries` requests the scan issues and which keys each carries.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
serde_json.workspace = true